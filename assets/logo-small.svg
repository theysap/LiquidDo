<!-- Simplified LiquidDo mark for the 16–32 px toolbar slots: bolder dots and bars, higher contrast. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 22 22" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="22" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5B5FED"/>
      <stop offset="100%" stop-color="#3A3FAD"/>
    </linearGradient>
  </defs>
  <rect width="22" height="22" rx="6" fill="url(#bg)"/>
  <circle cx="6.8" cy="7.8" r="2.6" fill="#fff"/>
  <rect x="11" y="6.5" width="7.5" height="2.6" rx="1.3" fill="#fff" fill-opacity="0.85"/>
  <circle cx="6.8" cy="14.6" r="2.6" fill="#fff" fill-opacity="0.6"/>
  <rect x="11" y="13.3" width="5.5" height="2.6" rx="1.3" fill="#fff" fill-opacity="0.55"/>
</svg>
