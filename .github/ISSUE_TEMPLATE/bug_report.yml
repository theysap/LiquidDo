name: Bug report
description: Something looks or behaves wrong in the LiquidDo popup
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Steps to reproduce help a lot.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: LiquidDo and Chrome versions
      placeholder: LiquidDo 1.0.0 · Chrome 141
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional — please blur any personal task text.
  - type: input
    id: timezone
    attributes:
      label: Time zone (for due-date problems)
      placeholder: Picked America/New_York · my computer is Asia/Kolkata
