<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiquidDo</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app">
      <!-- Header -->
      <header class="header">
        <div class="header-glass">
          <div class="header-left">
            <div class="app-icon">
              <img src="icons/logo.svg" width="22" height="22" alt="" />
            </div>
            <span class="app-title">LiquidDo</span>
          </div>
          <div class="task-count" id="taskCount">0 tasks</div>
        </div>
      </header>

      <!-- Tab Bar -->
      <div class="tab-bar" role="tablist">
        <button class="tab active" id="tabActive" role="tab" aria-selected="true">
          <span class="tab-dot active-dot"></span>
          Active
        </button>
        <button class="tab" id="tabCompleted" role="tab" aria-selected="false">
          <span class="tab-dot done-dot"></span>
          Completed
        </button>
      </div>

      <!-- Task Input -->
      <div class="input-section" id="inputSection">
        <div class="input-glass">
          <input
            type="text"
            id="taskInput"
            class="task-input"
            placeholder="Add a new task…"
            maxlength="120"
            autocomplete="off"
            spellcheck="false"
            aria-label="New task"
          />
          <button class="add-btn" id="addBtn" aria-label="Add task">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <rect x="7.1" y="2.5" width="1.8" height="11" rx="0.9" fill="white" />
              <rect x="2.5" y="7.1" width="11" height="1.8" rx="0.9" fill="white" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Tasks List -->
      <main class="tasks-container" id="tasksContainer">
        <div class="tasks-list" id="tasksList"></div>
        <div class="empty-state" id="emptyState" hidden>
          <div class="empty-icon">
            <svg width="40" height="40" viewBox="0 0 40 40" fill="none" aria-hidden="true">
              <circle cx="20" cy="20" r="18" stroke="rgba(108,112,240,0.3)" stroke-width="1.5" />
              <path
                d="M13 20.5l5 5 9-10"
                stroke="rgba(108,112,240,0.5)"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <p class="empty-title" id="emptyTitle">All clear!</p>
          <p class="empty-sub" id="emptySub">Add a task above to get started.</p>
        </div>
      </main>

      <!-- Footer Actions (for completed tab) -->
      <div class="footer" id="footer" hidden>
        <button class="clear-btn" id="clearBtn">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
            <path
              d="M2 2l9 9M11 2l-9 9"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
          Clear all completed
        </button>
      </div>

      <!-- Help links -->
      <footer class="bottom-bar">
        <a href="https://theysap.com/extensions/liquid-do/#manual" target="_blank">User manual</a>
        <span class="bottom-sep" aria-hidden="true">·</span>
        <a href="https://github.com/theysap/LiquidDo/issues/new/choose" target="_blank"
          >Report an issue</a
        >
        <span class="version" id="version"></span>
      </footer>
    </div>

    <!-- Due date sheet -->
    <div class="sheet" id="dueSheet" hidden>
      <div class="sheet-scrim" data-close></div>
      <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="dueHeading">
        <div class="sheet-head">
          <div class="sheet-heading">
            <p class="sheet-title" id="dueHeading">Due date</p>
            <p class="sheet-task" id="dueTask"></p>
          </div>
          <button class="icon-btn" data-close aria-label="Close">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
              <path
                d="M2 2l8 8M10 2l-8 8"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>

        <div class="chips">
          <button class="chip" data-quick="0">Today</button>
          <button class="chip" data-quick="1">Tomorrow</button>
          <button class="chip" data-quick="7">Next week</button>
        </div>

        <div class="cal">
          <div class="cal-head">
            <button class="icon-btn" id="calPrev" aria-label="Previous month">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
                <path
                  d="M7.5 2.5L4 6l3.5 3.5"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <span class="cal-month" id="calMonth" aria-live="polite"></span>
            <button class="icon-btn" id="calNext" aria-label="Next month">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
                <path
                  d="M4.5 2.5L8 6 4.5 9.5"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
          <div class="cal-week" id="calWeek" aria-hidden="true"></div>
          <div class="cal-grid" id="calGrid" role="grid"></div>
        </div>

        <div class="field-row">
          <label class="field field-time">
            <span>Time</span>
            <input type="time" id="dueTime" required />
          </label>
          <label class="field field-zone">
            <span>Time zone</span>
            <select id="dueZone"></select>
          </label>
        </div>

        <p class="due-preview" id="duePreview" aria-live="polite"></p>

        <div class="sheet-actions">
          <button class="btn btn-ghost" id="dueRemove">Remove</button>
          <button class="btn btn-primary" id="dueSave">Set due date</button>
        </div>
      </div>
    </div>

    <script src="tasks.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
